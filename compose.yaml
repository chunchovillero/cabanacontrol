name: cabanacontrol
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configura .env}
      POSTGRES_USER: ${POSTGRES_USER:?Configura .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8000}:8000'
    volumes:
      - ./backend:/app
      - private_media:/var/lib/cabanacontrol/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health/", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
  whatsapp-worker:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
    command: [python, manage.py, whatsapp_worker]
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-5173}:5173'
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:5173").then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
volumes:
  postgres_data:
  frontend_modules:
  private_media:

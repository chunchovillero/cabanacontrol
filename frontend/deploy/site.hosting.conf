server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /cabanacontrol { return 308 /cabanacontrol/; }

    location ~ ^/cabanacontrol/(api/|health/|webhooks/) {
        rewrite ^/cabanacontrol/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host labrawebs.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_connect_timeout 3s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location /cabanacontrol/assets/ {
        rewrite ^/cabanacontrol/(.*)$ /$1 break;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /cabanacontrol/ {
        rewrite ^/cabanacontrol/(.*)$ /$1 break;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Internal redirects from try_files (for example /index.html) are handled
    # here after the public /cabanacontrol prefix has been stripped.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

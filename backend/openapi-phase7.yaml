          type: string
          format: date
        required: true
      - in: query
        name: property_id
        schema:
          type: string
          format: uuid
      - in: query
        name: to
        schema:
          type: string
          format: date
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResult'
          description: ''
  /api/v1/context/:

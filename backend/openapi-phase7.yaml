        schema:
          type: string
          format: uuid
        description: UUID esperado de la empresa activa, validado contra sesión.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestSearchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GuestSearchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GuestSearchRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestSearchResult'
          description: ''
  /api/v1/payments/{payment_id}/receipt/:
    get:
      operationId: api_v1_payments_receipt_retrieve
      parameters:
      - in: path
        name: payment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
          description: ''
    post:
      operationId: api_v1_payments_receipt_create
      parameters:
      - in: header
        name: X-Tenant-Context
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: payment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReceiptUploadRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/v1/payments/{payment_id}/void/:
    post:
      operationId: api_v1_payments_void_create
      parameters:
      - in: header
        name: X-Tenant-Context
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: payment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentVoidRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentVoidRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentVoidRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/v1/properties/:
    get:
      operationId: api_v1_properties_list
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertyList'
          description: ''
    post:
      operationId: api_v1_properties_create
      parameters:
      - in: header
        name: X-Tenant-Context
        schema:
          type: string
          format: uuid
        description: UUID esperado de la empresa activa; no selecciona ni concede
          acceso.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PropertyWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PropertyWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
          description: ''
  /api/v1/properties/{property_id}/:
    get:
      operationId: api_v1_properties_retrieve
      parameters:
      - in: path
        name: property_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
          description: ''
    patch:
      operationId: api_v1_properties_partial_update
      parameters:
      - in: header
        name: X-Tenant-Context
        schema:
          type: string
          format: uuid
        description: UUID esperado de la empresa activa; no selecciona ni concede
          acceso.
        required: true
      - in: path
        name: property_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPropertyWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPropertyWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPropertyWriteRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
          description: ''
  /api/v1/properties/{property_id}/photos/:
    get:
      operationId: api_v1_properties_photos_list
      parameters:
      - in: path
        name: property_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PropertyPhoto'
          description: ''
    post:
      operationId: api_v1_properties_photos_create
      parameters:
      - in: header
        name: X-Tenant-Context
        schema:
          type: string
          format: uuid
        description: UUID esperado de la empresa activa; no selecciona ni concede
          acceso.
        required: true
      - in: path
        name: property_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhotoUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhotoUploadRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyPhoto'
          description: ''
  /api/v1/properties/{property_id}/photos/{photo_id}/:
    patch:
      operationId: api_v1_properties_photos_partial_update
      parameters:
      - in: header
        name: X-Tenant-Context
        schema:
          type: string
          format: uuid
        description: UUID esperado de la empresa activa; no selecciona ni concede
          acceso.
        required: true
      - in: path
        name: photo_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: property_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPhotoWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPhotoWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPhotoWriteRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyPhoto'
          description: ''
  /api/v1/properties/{property_id}/photos/{photo_id}/file/:
    get:
      operationId: api_v1_properties_photos_file_retrieve
      parameters:
      - in: path
        name: photo_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: property_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/reports/:
    get:
      operationId: api_v1_reports_retrieve
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: kind
        schema:
          enum:
          - summary
          - reservations
          - payments
          type: string
          default: summary
          minLength: 1
        description: |-
          * `summary` - summary
          * `reservations` - reservations
          * `payments` - payments
      - in: query
        name: page
        schema:
          type: integer
          maximum: 10000
          minimum: 1
          default: 1
      - in: query
        name: property_id
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        schema:
          enum:
          - draft
          - pending
          - confirmed
          - checked_in
          - checked_out
          - cancelled
          - no_show
          type: string
          minLength: 1
        description: |-
          * `draft` - Borrador
          * `pending` - Pendiente
          * `confirmed` - Confirmada
          * `checked_in` - En estadía
          * `checked_out` - Finalizada
          * `cancelled` - Cancelada
          * `no_show` - No se presentó
      - in: query
        name: to
        schema:
          type: string
          format: date
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResult'
          description: ''
  /api/v1/reports/export/:
    get:
      operationId: api_v1_reports_export_retrieve
      parameters:
      - in: header
        name: X-Tenant-Context
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: from
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: kind
        schema:
          enum:
          - summary
          - reservations
          - payments
          type: string
          default: summary
          minLength: 1
        description: |-
          * `summary` - summary
          * `reservations` - reservations
          * `payments` - payments
      - in: query
        name: property_id
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        schema:
          enum:
          - draft
          - pending
          - confirmed
          - checked_in
          - checked_out
          - cancelled
          - no_show
          type: string
          minLength: 1
        description: |-
          * `draft` - Borrador
          * `pending` - Pendiente
          * `confirmed` - Confirmada
          * `checked_in` - En estadía
          * `checked_out` - Finalizada
          * `cancelled` - Cancelada
          * `no_show` - No se presentó
      - in: query
        name: to
        schema:
          type: string
          format: date
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/reservations/:
    get:
      operationId: api_v1_reservations_list
      parameters:
      - in: query
        name: debt
        schema:
          type: boolean
      - in: query
        name: from_date
        schema:
          type: string
          format: date
      - name: page

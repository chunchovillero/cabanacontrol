openapi: 3.0.3
info:
  title: CabañaControl API
  version: 1.0.0
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: api_v1_auth_csrf_retrieve
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: api_v1_auth_login_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: api_v1_auth_logout_create
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: api_v1_auth_me_retrieve
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/auth/password-reset/:
    post:
      operationId: api_v1_auth_password_reset_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: api_v1_auth_password_reset_confirm_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/availability/:
    get:
      operationId: api_v1_availability_list
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: guests
        schema:
          type: integer
          maximum: 32767
          minimum: 1
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: property_id
        schema:
          type: string
          format: uuid
      - in: query
        name: to
        schema:
          type: string
          format: date
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAvailabilityItemList'
          description: ''
  /api/v1/availability-blocks/:
    get:
      operationId: api_v1_availability_blocks_list
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: property_id
        schema:
          type: string
          format: uuid
      - in: query
        name: reason
        schema:
          type: string
          enum:
          - maintenance
          - other
          - owner_use
        description: |-
          * `maintenance` - Mantenimiento
          * `owner_use` - Uso del propietario
          * `other` - Otro
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBlockList'
          description: ''
    post:
      operationId: api_v1_availability_blocks_create
      parameters:
      - in: header
        name: X-Tenant-Context
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BlockWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BlockWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Block'
          description: ''
  /api/v1/availability-blocks/{block_id}/:
    get:
      operationId: api_v1_availability_blocks_retrieve
      parameters:
      - in: path
        name: block_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Block'
          description: ''
    patch:
      operationId: api_v1_availability_blocks_partial_update
      parameters:
      - in: header
        name: X-Tenant-Context
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: block_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBlockWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBlockWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBlockWriteRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Block'
          description: ''
  /api/v1/calendar/:
    get:
      operationId: api_v1_calendar_retrieve
      parameters:
      - in: query

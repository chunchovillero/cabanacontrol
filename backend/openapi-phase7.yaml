        required: true
      - in: query
        name: property_id
        schema:
          type: string
          format: uuid
      - in: query
        name: to
        schema:
          type: string
          format: date
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResult'
          description: ''
  /api/v1/guests/:
    get:
      operationId: api_v1_guests_list
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
      - in: query
        name: document_type
        schema:
          type: string
          enum:
          - other
          - passport
          - rut
        description: |-
          * `rut` - RUT chileno
          * `passport` - Pasaporte
          * `other` - Otro documento
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGuestListList'
          description: ''
    post:
      operationId: api_v1_guests_create
      parameters:
      - in: header
        name: X-Tenant-Context
        schema:
          type: string
          format: uuid
        description: UUID esperado de la empresa activa, validado contra sesión.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GuestWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GuestWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestDetail'
          description: ''
  /api/v1/guests/{guest_id}/:
    get:
      operationId: api_v1_guests_retrieve
      parameters:
      - in: path
        name: guest_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestDetail'
          description: ''
    patch:
      operationId: api_v1_guests_partial_update
      parameters:
      - in: header
        name: X-Tenant-Context
        schema:
          type: string
          format: uuid
        description: UUID esperado de la empresa activa, validado contra sesión.
        required: true
      - in: path
        name: guest_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGuestWriteRequest'
          application/x-www-form-urlencoded:
            schema:

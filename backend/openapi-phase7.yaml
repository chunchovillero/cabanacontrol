components:
  schemas:
    AvailabilityItem:
      type: object
      properties:
        property_id:
          type: string
          format: uuid
        property_name:
          type: string
        capacity:
          type: integer
        available:
          type: boolean
      required:
      - available
      - capacity
      - property_id
      - property_name
    Block:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        property_id:
          type: string
          format: uuid
          readOnly: true
        property_name:
          type: string
          readOnly: true
        start_date:
          type: string
          format: date
          readOnly: true
        end_date:
          type: string
          format: date
          readOnly: true
        reason:
          allOf:
          - $ref: '#/components/schemas/ReasonEnum'
          readOnly: true
        notes:
          type: string
          readOnly: true
        active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active
      - created_at
      - end_date
      - id
      - notes
      - property_id
      - property_name
      - reason
      - start_date
      - updated_at
    BlockWriteRequest:
      type: object
      properties:
        property_id:
          type: string
          format: uuid
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        reason:
          $ref: '#/components/schemas/ReasonEnum'
        notes:
          type: string
          default: ''
          maxLength: 2000
        active:
          type: boolean
          default: true
      required:
      - end_date
      - property_id
      - reason
      - start_date
    CalendarEvent:
      type: object
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/KindEnum'
        entity_id:
          type: string
          format: uuid
        property_id:
          type: string
          format: uuid
        property_name:
          type: string
        property_active:
          type: boolean
        title:
          type: string
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        status:
          type: string
        blocks_inventory:
          type: boolean
        url:
          type: string
      required:
      - blocks_inventory
      - end
      - entity_id
      - id
      - kind
      - property_active
      - property_id
      - property_name
      - start
      - status
      - title
      - url
    CalendarResult:
      type: object
      properties:
        timezone:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/CalendarEvent'
      required:
      - events
      - timezone
    CancelRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - reason
    Csrf:
      type: object
      properties:
        csrf_token:
          type: string
          readOnly: true
      required:
      - csrf_token
    DashboardResult:
      type: object
      properties:
        timezone:
          type: string
        from_date:
          type: string
          format: date
        to_date:
          type: string
          format: date
        today:
          $ref: '#/components/schemas/TodayMetrics'
        occupied_nights:
          type: integer
        capacity_nights:
          type: integer
        occupancy_percent:
          type: string
        blocked_nights:
          type: integer
        money:
          type: array
          items:
            $ref: '#/components/schemas/MoneyMetrics'
      required:
      - blocked_nights
      - capacity_nights
      - from_date
      - money
      - occupancy_percent
      - occupied_nights
      - timezone
      - to_date
      - today
    DocumentTypeEnum:
      enum:
      - rut
      - passport
      - other
      type: string
      description: |-
        * `rut` - RUT chileno
        * `passport` - Pasaporte
        * `other` - Otro documento
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:

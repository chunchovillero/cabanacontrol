components:
  schemas:
    AcceptInputRequest:
      type: object
      properties:
        key:
          type: string
          format: uuid
        terms:
          type: string
          minLength: 1
          maxLength: 30
        consent:
          type: boolean
      required:
      - consent
      - key
      - terms
    AnalyzeRequest:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
        text:
          type: string
          minLength: 1
          maxLength: 4000
        reviewed:
          type: boolean
      required:
      - reviewed
      - revision
      - text
    Assignee:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    Attempt:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          $ref: '#/components/schemas/AttemptKindEnum'
        code:
          type: string
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        state:
          $ref: '#/components/schemas/StateEnum'
        quoted_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        contract_revision:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - amount
      - code
      - expires_at
      - id
      - kind
      - quoted_at
    AttemptKindEnum:
      enum:
      - purchase
      - upgrade
      - renewal
      type: string
      description: |-
        * `purchase` - Compra
        * `upgrade` - Subida
        * `renewal` - Renovación
    AvailabilityItem:
      type: object
      properties:
        property_id:
          type: string
          format: uuid
        property_name:
          type: string
        capacity:
          type: integer
        available:
          type: boolean
      required:
      - available
      - capacity
      - property_id
      - property_name
    Block:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        property_id:
          type: string
          format: uuid
          readOnly: true
        property_name:
          type: string
          readOnly: true
        start_date:
          type: string
          format: date
          readOnly: true
        end_date:
          type: string
          format: date
          readOnly: true
        reason:
          allOf:
          - $ref: '#/components/schemas/ReasonEnum'
          readOnly: true
        notes:
          type: string
          readOnly: true
        active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active
      - created_at
      - end_date
      - id
      - notes
      - property_id
      - property_name
      - reason
      - start_date
      - updated_at
    BlockWriteRequest:
      type: object
      properties:
        property_id:
          type: string
          format: uuid
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        reason:
          $ref: '#/components/schemas/ReasonEnum'
        notes:
          type: string
          default: ''
          maxLength: 2000
        active:
          type: boolean
          default: true
      required:
      - end_date
      - property_id
      - reason
      - start_date
    CalendarEvent:
      type: object
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/CalendarEventKindEnum'
        entity_id:
          type: string
          format: uuid
        property_id:
          type: string
          format: uuid
        property_name:
          type: string
        property_active:
          type: boolean
        title:
          type: string
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        status:
          type: string
        blocks_inventory:
          type: boolean
        url:
          type: string
      required:
      - blocks_inventory
      - end
      - entity_id
      - id
      - kind
      - property_active
      - property_id
      - property_name
      - start
      - status
      - title
      - url
    CalendarEventKindEnum:
      enum:
      - reservation
      - block
      type: string
      description: |-
        * `reservation` - reservation
        * `block` - block
    CalendarResult:
      type: object
      properties:
        timezone:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/CalendarEvent'
      required:
      - events
      - timezone
    CancelRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - reason
    Capabilities:
      type: object
      properties:
        simulated:
          type: boolean
        ready:
          type: boolean
        enabled:
          type: boolean
        voice_enabled:
          type: boolean
        settings:
          $ref: '#/components/schemas/Settings'
      required:
      - enabled
      - ready
      - settings
      - simulated
      - voice_enabled
    CodeEnum:
      enum:
      - initial
      - growth
      - operator
      type: string
      description: |-
        * `initial` - initial
        * `growth` - growth
        * `operator` - operator
    CompanySettings:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        legal_name:
          type: string
          maxLength: 200
        contact_email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        contact_phone:
          type: string
          maxLength: 30
        timezone:
          type: string
          readOnly: true
        currency:
          type: string
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - contact_email
      - contact_phone
      - currency
      - id
      - legal_name
      - name
      - timezone
      - updated_at
    Connection:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        business_id:
          type: string
          readOnly: true
        phone_number_id:
          type: string
          readOnly: true
        display_phone:
          type: string
          readOnly: true
        enabled:
          type: boolean
          readOnly: true
        revision:
          type: integer
          readOnly: true
        token_configured:
          type: boolean
          readOnly: true
      required:
      - business_id
      - display_phone
      - enabled
      - id
      - phone_number_id
      - revision
      - token_configured
    ConsentRequest:
      type: object
      properties:
        conversation_id:
